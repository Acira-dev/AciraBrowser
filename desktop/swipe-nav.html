<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; font-src 'self'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Swipe</title>
<style>
/* The two-finger swipe between pages (desktop/swipe-nav.cjs). Two small native views above the page use this one file: ?role=chip is the
   arrow that follows the fingers from the page's edge, ?role=list is the list of earlier pages that opens when the swipe is held.
   Surfaces are the tab hover card's (solid, hairline ring, the soft layered shadow); the rows are the address suggestions' (44px, 16px
   icon, a 13px title over an 11px address, a quiet selection). Inter, the browser's one typeface. */
@font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:block;src:url('../dist/fonts/InterVariable.woff2') format('woff2')}
*,::before,::after{font-feature-settings:'cv11','ss03'!important}
:root{
 /* The interface's popup colours, as a fallback until main sends the real ones (--overlay, --text, --muted, --menu-hover, --float-shadow). */
 --overlay:#333436;--text:#ededef;--muted:#a2a3a5;--menu-hover:rgb(255 255 255/.06);
 --shadow:0 0 0 1px rgb(0 0 0/.45),0 1px 2px rgb(0 0 0/.2),0 8px 24px -4px rgb(0 0 0/.32);
 --rim:inset 0 0 0 1px rgb(255 255 255/.08),inset 0 1px 0 rgb(255 255 255/.05);
 --ease:cubic-bezier(.3,0,.2,1);--speed:1;
 color-scheme:dark;
}
body.light{
 --overlay:#ffffff;--text:#25262b;--muted:#686b73;--menu-hover:rgb(0 0 0/.05);
 --shadow:0 0 0 1px rgb(0 0 0/.06),0 1px 2px rgb(0 0 0/.06),0 8px 24px -4px rgb(0 0 0/.16);
 --rim:inset 0 0 0 1px rgb(0 0 0/.04);
 color-scheme:light;
}
body.fast{--speed:.6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:400 13px/16px Inter,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none;cursor:default}
/* The arrow. The view is a fixed strip at the page's edge, so what slides out of the edge is clipped by the view itself. */
#chip{position:absolute;top:28px;left:0;width:36px;height:36px;border-radius:10px;background:var(--overlay);box-shadow:var(--rim),var(--shadow);display:grid;place-items:center;color:var(--muted);opacity:0;will-change:transform;transform-origin:50% 50%}
#chip svg{display:block;width:18px;height:18px;fill:currentColor;transition:opacity calc(140ms*var(--speed)) var(--ease)}
#chip svg.fwd,body.right #chip svg.back{display:none}
body.right #chip svg.fwd{display:block}
#chip.armed{color:var(--text);scale:1.08}
body.off #chip svg{transition:none}
/* The list. */
#list{position:absolute;inset:28px;border-radius:8px;background:var(--overlay);box-shadow:var(--rim),var(--shadow);padding:4px;opacity:0;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:12px;height:44px;padding:0 8px;border-radius:4px;color:var(--text)}
.row.sel{background:var(--menu-hover)}
.ico{flex:0 0 16px;width:16px;height:16px;display:grid;place-items:center;border-radius:3px;overflow:hidden;background:var(--menu-hover);color:var(--muted);font-size:10px;line-height:16px;font-weight:600}
.ico img{display:block;width:16px;height:16px;object-fit:contain}
.ico.has{background:transparent}
.copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.copy span{font-size:13px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.copy small{font-size:11px;line-height:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (forced-colors:active){#chip,#list{border:1px solid CanvasText;box-shadow:none}}
</style>
</head>
<body>
<div id="chip" aria-hidden="true">
 <svg class="back" viewBox="0 0 16 16"><path d="M13.493 8H3.733L7.84 3.84Q8 3.733 8 3.52Q8 3.307 7.867 3.147Q7.733 2.987 7.52 2.987Q7.307 2.987 7.147 3.147L2.133 8.16Q1.973 8.32 1.973 8.507Q1.973 8.693 2.133 8.853L7.147 13.867Q7.307 14.027 7.493 14.027Q7.68 14.027 7.84 13.867Q8 13.707 8 13.493Q8 13.28 7.84 13.173L3.733 9.013H13.493Q13.707 9.013 13.867 8.853Q14.027 8.693 14.027 8.507Q14.027 8.32 13.867 8.16Q13.707 8 13.493 8Z"/></svg>
 <svg class="fwd" viewBox="0 0 16 16"><path d="M13.867 8.16 8.853 3.147Q8.693 2.987 8.48 2.987Q8.267 2.987 8.133 3.147Q8 3.307 8 3.493Q8 3.68 8.16 3.84L12.267 8H2.507Q2.293 8 2.16 8.133Q2.027 8.267 2.027 8.48Q2.027 8.693 2.16 8.853Q2.293 9.013 2.507 9.013H12.267L8.16 13.12Q8 13.28 8 13.493Q8 13.707 8.133 13.84Q8.267 13.973 8.48 13.973Q8.693 13.973 8.853 13.867L13.867 8.853Q14.027 8.693 14.027 8.48Q14.027 8.267 13.867 8.16Z"/></svg>
</div>
<div id="list" aria-hidden="true"></div>
<script>
const $=id=>document.getElementById(id),body=document.body,chip=$('chip'),list=$('list');
const role=new URLSearchParams(location.search).get('role')==='list'?'list':'chip';
// Geometry in interface pixels (desktop/swipe-nav.cjs holds the same numbers).
const STRIP=76,CHIP=36,REST=12,TRAVEL=REST+CHIP+4;
let side='left',off=false,progress=0,armed=false,gone=null;
const ease=value=>1-(1-value)*(1-value);
// Where the chip's left edge is for a progress: out past the page's edge at 0, at rest at 1; it appears quickly and settles.
const position=p=>{const x=off?REST:REST-(1-ease(p))*TRAVEL;return side==='left'?x:STRIP-CHIP-x;};
const duration=ms=>off?0:Math.round(ms*(body.classList.contains('fast')?.6:1));
// The interface's colours arrive as CSS values from main (its own theme); only these names, and only plain colour and shadow syntax, are taken.
const TOKENS=['--overlay','--text','--muted','--menu-hover','--float-shadow'];
const plain=value=>typeof value==='string'&&value.length<400&&/^[#\w\s().,%/+-]+$/.test(value);
// The popup shadow is long; the views have room for its first three layers (the ring and the close and middle shadows).
const shadowOf=value=>{const layers=[];let depth=0,from=0;for(let i=0;i<=value.length;i++){const c=value[i];if(c==='(')depth++;else if(c===')')depth--;else if((c===','&&depth===0)||i===value.length){layers.push(value.slice(from,i).trim());from=i+1;}}return layers.slice(0,3).join(',');};
function setTokens(tokens){
 const root=document.documentElement.style;
 for(const key of TOKENS){
  const value=tokens&&tokens[key];
  if(!plain(value)){root.removeProperty(key==='--float-shadow'?'--shadow':key);continue;}
  if(key==='--float-shadow')root.setProperty('--shadow',shadowOf(value));else root.setProperty(key,value);
 }
}
function setLook(state){
 if(!('dark' in state))return;   // only the messages that carry the look (show, list, leave) set it
 body.classList.toggle('light',state.dark===false);setTokens(state.tokens);
 off=state.motion==='off';body.classList.toggle('off',off);body.classList.toggle('fast',state.motion==='fast');
}
function drawChip(){
 // Reduced motion: no slide. The chip is there, at rest, once the swipe is clearly a swipe.
 const shown=off?progress>=.3:progress>0;
 // Only the pop of the armed state (the separate `scale` property) eases; the slide follows the fingers exactly.
 chip.style.transition=off?'none':`scale ${duration(170)}ms var(--ease)`;
 chip.style.transform=`translateX(${position(progress)}px)`;
 chip.style.opacity=shown?'1':'0';
}
function leaveChip(how){
 const ms=duration(how==='commit'?140:180);
 chip.style.transition=ms?`transform ${ms}ms var(--ease),opacity ${ms}ms var(--ease),scale ${ms}ms var(--ease)`:'none';
 if(how==='commit'){chip.style.opacity='0';chip.style.transform=`translateX(${position(1)}px) scale(.9)`;}
 else{chip.style.opacity='0';chip.style.transform=`translateX(${off?position(1):position(0)}px)`;}
}
function buildList(state){
 list.textContent='';
 state.rows.forEach((row,i)=>{
  const el=document.createElement('div');el.className='row'+(i===state.selected?' sel':'');
  const ico=document.createElement('span');ico.className='ico';
  if(typeof row.icon==='string'&&row.icon.startsWith('data:image/')){const img=document.createElement('img');img.alt='';img.src=row.icon;ico.appendChild(img);ico.classList.add('has');}
  else ico.textContent=(Array.from(row.address||row.title||'?')[0]||'?').toUpperCase();
  const copy=document.createElement('span');copy.className='copy';
  const title=document.createElement('span');title.textContent=row.title||row.address||'';
  const small=document.createElement('small');small.textContent=row.address||'';
  copy.append(title,small);el.append(ico,copy);list.appendChild(el);
 });
}
function openList(state){
 side=state.side==='right'?'right':'left';
 buildList(state);
 const ms=duration(200),dx=side==='left'?-6:6;
 list.style.transformOrigin=side==='left'?'0 50%':'100% 50%';
 list.style.transition='none';list.style.opacity=off?'1':'0';list.style.transform=off?'none':`translateX(${dx}px) scale(.97)`;
 if(off)return;
 void list.offsetWidth;
 list.style.transition=`opacity ${duration(100)}ms var(--ease),transform ${ms}ms var(--ease)`;list.style.opacity='1';list.style.transform='none';
}
swipeNav.onState(state=>{
 setLook(state);
 if(role==='chip'){
  if(state.type==='show'){side=state.side==='right'?'right':'left';body.classList.toggle('right',side==='right');progress=0;armed=false;chip.classList.remove('armed');drawChip();}
  else if(state.type==='progress'){progress=state.progress;drawChip();}
  else if(state.type==='armed'){armed=!!state.on;chip.classList.toggle('armed',armed);}
  else if(state.type==='leave')leaveChip(state.leave);
 }else{
  if(state.type==='list')openList(state);
  else if(state.type==='select'){[...list.children].forEach((el,i)=>el.classList.toggle('sel',i===state.index));}
  else if(state.type==='leave'){const ms=duration(120);list.style.transition=ms?`opacity ${ms}ms var(--ease)`:'none';list.style.opacity='0';}
 }
});
document.fonts.load('400 13px Inter').catch(()=>{}).finally(()=>swipeNav.ready());
</script>
</body>
</html>
